[package]
name = "utss-rust"
version = "0.1.0"
edition = "2021"
description = "Universal Type and Symbol System (UTSS) Rust Catalog Harvester"
license = "MIT"

[lib]
name = "utss_rust"
path = "src/lib.rs"

[[bin]]
name = "utss-rs"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
